name: Midday nightly-attribution retry

# Vercel Cron Jobs sont limités à 1 par projet sur notre plan actuel — voir
# vercel.json, qui ne porte donc que le tick de nuit (02h UTC). Ce workflow
# est le second tick : il appelle en HTTP le même endpoint que le cron
# Vercel, avec `mode=retry` (voir enqueueZeroRowRetryForAllProjects dans
# lib/attribution/queue.ts), qui ne retente que les jours coincés à 0
# ligne/en échec sans retoucher les jours déjà réussis.
#
# Programmé à 9h UTC, PAS midi : les `schedule` GitHub Actions ne se
# déclenchent pas à l'heure pile (limitation connue et documentée de GitHub —
# file d'attente partagée), constaté en prod deux jours de suite avec un
# décalage de 3h+ sur un cron à 12h (déclenchements réels à 15h20 et 15h48
# UTC). Avancer l'horaire programmé absorbe ce délai pour viser un
# déclenchement effectif en tout début d'après-midi plutôt qu'en fin
# d'après-midi.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  retry:
    name: Retry zero-row nightly jobs
    runs-on: ubuntu-latest
    steps:
      - name: Call the retry endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.PROD_CRON_SECRET }}" \
            "https://attribmaster.com/api/cron/nightly-attribution?mode=retry")
          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "Retry endpoint returned HTTP $status"
            exit 1
          fi
